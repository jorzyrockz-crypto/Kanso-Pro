<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eaf5fc" />
    <meta name="app-version" content="__KANSO_APP_VERSION__" />
    <!-- kanso:appearance-before-paint -->
    <meta name="description" content="A little structure. A lot of possibility. Bring your events, tasks, projects, and reflections together in one fluid journey." />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kanso Pro" />
    <title>Kanso Pro — Your days, connected.</title>
    <style>
      #app-splash {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 19% 18%, rgb(125 211 252 / 56%), transparent 29rem),
          radial-gradient(circle at 86% 76%, rgb(165 243 252 / 58%), transparent 31rem),
          linear-gradient(145deg, #eff9fd, #e3f3fa 52%, #f7fcff);
        color: #17374f;
        isolation: isolate;
        transition: opacity .3s ease, visibility 0s linear .3s;
      }
      #app-splash::before, #app-splash::after { position: absolute; z-index: -1; border-radius: 50%; content: ''; }
      #app-splash::before { width: min(66vw, 34rem); height: min(66vw, 34rem); border: 1px solid rgb(255 255 255 / 72%); transform: translate(-42%, -43%); background: rgb(255 255 255 / 18%); }
      #app-splash::after { right: -11rem; bottom: -13rem; width: min(58vw, 30rem); height: min(58vw, 30rem); border: 1px solid rgb(255 255 255 / 66%); background: rgb(255 255 255 / 22%); }
      .app-splash-content { display: flex; width: min(100%, 20rem); flex-direction: column; align-items: center; text-align: center; }
      .app-splash-mark { display: grid; width: 5rem; height: 5rem; place-items: center; border: 1px solid rgb(255 255 255 / 85%); border-radius: 1.625rem; background: rgb(255 255 255 / 58%); box-shadow: 0 1.25rem 3.75rem rgb(28 93 130 / 16%), inset 0 1px 0 rgb(255 255 255 / 78%); }
      .app-splash-mark > img { display: block; width: 3.625rem; height: 3.625rem; object-fit: contain; }
      .app-splash-kicker { margin: 1.5rem 0 .375rem; color: #52758b; font: 750 .5625rem/1.4 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .1375rem; text-transform: uppercase; }
      .app-splash-title { margin: 0; color: #17374f; font: 800 clamp(2rem, 7vw, 2.75rem)/1.12 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -.1rem; }
      .app-splash-title > span { color: #54728a; font-weight: 500; }
      .app-splash-copy { max-width: 17rem; margin: .625rem 0 1.375rem; color: #5b778d; font: 500 .75rem/1.75 -apple-system, BlinkMacSystemFont, sans-serif; }
      .app-splash-progress { width: 7.5rem; height: .25rem; overflow: hidden; border-radius: 99px; background: rgb(42 125 172 / 15%); }
      .app-splash-progress > span { display: block; width: 44%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #21b7ed, #2477ce); animation: kanso-splash-progress 1.1s ease-in-out infinite; }
      #app-splash.is-ready { visibility: hidden; pointer-events: none; opacity: 0; }
      html[data-theme='dark'] #app-splash { background: radial-gradient(circle at 18% 18%, rgb(21 98 137 / 42%), transparent 29rem), radial-gradient(circle at 86% 76%, rgb(23 78 111 / 42%), transparent 31rem), linear-gradient(145deg, #0c1724, #122538 52%, #0f2031); color: #e5f4fb; }
      html[data-theme='dark'] .app-splash-mark { border-color: rgb(154 219 247 / 24%); background: rgb(30 66 91 / 74%); box-shadow: 0 1.25rem 3.75rem rgb(0 0 0 / 28%), inset 0 1px 0 rgb(255 255 255 / 11%); }
      html[data-theme='dark'] .app-splash-kicker, html[data-theme='dark'] .app-splash-copy { color: #a8c2d1; }
      html[data-theme='dark'] .app-splash-title { color: #e5f4fb; }
      html[data-theme='dark'] .app-splash-title > span { color: #9ab8ca; }
      html[data-theme='dark'] .app-splash-progress { background: rgb(170 222 246 / 16%); }
      @keyframes kanso-splash-progress { 0% { transform: translateX(-115%); } 55%, 100% { transform: translateX(270%); } }
      @media (prefers-reduced-motion: reduce) { .app-splash-progress > span { width: 100%; animation: none; } #app-splash { transition-duration: 0s; } }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-label="Opening Kanso Pro">
      <div class="app-splash-content">
        <div class="app-splash-mark"><img src="/icons/icon-192.png" width="58" height="58" alt="" decoding="async" /></div>
        <p class="app-splash-kicker">Your personal planning space</p>
        <h1 class="app-splash-title">Kanso <span>Pro</span></h1>
        <p class="app-splash-copy">A little structure. A lot of possibility.</p>
        <div class="app-splash-progress" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
